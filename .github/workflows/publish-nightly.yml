name: Publish-Nightly

on:
  workflow_dispatch:
    inputs:
      build-dependent:
        description: 'Should build dependent repositories?'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      build-dependent:
        description: 'Should build dependent repositories?'
        required: false
        default: false
        type: boolean
    secrets:
      WORKFLOW_ACCESS_TOKEN:
        required: true
      ACTIONS_READ_ACCESS_TOKEN:
        required: true

env:
  REPOSITORY_NAME: ${{ github.event.repository.name }}
  PROJECT_NAME: 'openponk-${{ github.event.repository.name }}'
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  VERSION: 'nightly'
  RUN_ID: ${{ github.run_id }}
  PHARO_VERSION: 14
  cache-name: zip-cache

jobs:

  init:
    runs-on: ubuntu-latest
    name: 'Initialize build environment'
    outputs:
      build_date: ${{ steps.set-date.outputs.build_date }}
    steps:
      - name: Generate, log and validate build date
        id: set-date
        shell: bash
        run: |
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          if [[ ! "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "ERROR: Generated date '$DATE' is not in valid ISO 8601 format!"
            exit 1
          fi
          echo "Generated UTC build date: $DATE"
          echo "build_date=$DATE" >> "$GITHUB_OUTPUT"
  
  build-win:
    needs: init
    runs-on: windows-latest
    env:
      PLATFORM: win
    name: 'Build Windows'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Prepare scripts directory
        run: md ci-scripts
      - name: Checkout scripts
        uses: actions/checkout@v7.0.1
        with:
          repository: OpenPonk/ci-scripts
          path: ci-scripts
      - name: Configure VM environment
        shell: bash
        run: |
          echo "VM_DIR=$RUNNER_TEMP/pharo-vm" >> "$GITHUB_ENV"
          echo "PHARO_VM=$RUNNER_TEMP/pharo-vm/pharo" >> "$GITHUB_ENV"
      - name: Prepare patched Pharo VM
        run: bash ci-scripts/.github/scripts/prepare-patched-pharo-vm.sh
        shell: bash
      - name: Load SmalltalkCI environment
        uses: hpi-swa/setup-smalltalkCI@1.6.3
        id: smalltalkci
        with:
          smalltalk-image: Pharo64-${{ env.PHARO_VERSION }}
      - name: Prepare image and test
        run: smalltalkci -s ${{ steps.smalltalkci.outputs.smalltalk-image }} --vm "$PHARO_VM"
        shell: bash
        timeout-minutes: 20
      - name: Create zip
        run: ci-scripts/.github/scripts/build-win.ps1
        env: 
          ACTIONS_READ_ACCESS_TOKEN: ${{ secrets.ACTIONS_READ_ACCESS_TOKEN }}
          BUILD_DATE: ${{ needs.init.outputs.build_date }}
      - name: Cache zip
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          key: ${{ github.run_id }}-${{ github.run_number }}_${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          enableCrossOsArchive: true

  build-linux:
    needs: init
    runs-on: ubuntu-latest
    env:
      PLATFORM: linux
    name: 'Build Linux'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Prepare scripts directory
        run: mkdir ci-scripts
      - name: Checkout scripts
        uses: actions/checkout@v7.0.1
        with:
          repository: OpenPonk/ci-scripts
          path: ci-scripts
      - name: Configure VM environment
        shell: bash
        run: |
          echo "VM_DIR=$RUNNER_TEMP/pharo-vm" >> "$GITHUB_ENV"
          echo "PHARO_VM=$RUNNER_TEMP/pharo-vm/pharo" >> "$GITHUB_ENV"
      - name: Prepare patched Pharo VM
        run: bash ci-scripts/.github/scripts/prepare-patched-pharo-vm.sh
      - name: Load SmalltalkCI environment
        uses: hpi-swa/setup-smalltalkCI@1.6.3
        id: smalltalkci
        with:
          smalltalk-image: Pharo64-${{ env.PHARO_VERSION }}
      - name: Prepare image and test
        run: smalltalkci -s ${{ steps.smalltalkci.outputs.smalltalk-image }} --vm "$PHARO_VM"
        shell: bash
        timeout-minutes: 12
      - name: Prepare zip script
        run: chmod u+x ci-scripts/.github/scripts/build-linux.sh
      - name: Create zip
        run: ci-scripts/.github/scripts/build-linux.sh
        env: 
          ACTIONS_READ_ACCESS_TOKEN: ${{ secrets.ACTIONS_READ_ACCESS_TOKEN }}
          BUILD_DATE: ${{ needs.init.outputs.build_date }}
      - name: Cache zip
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          key: ${{ github.run_id }}-${{ github.run_number }}_${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip

  build-mac-intel:
    needs: init
    runs-on: macos-15-intel
    env:
      PLATFORM: mac-intel
    name: 'Build Mac Intel'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Prepare scripts directory
        run: mkdir ci-scripts
      - name: Checkout scripts
        uses: actions/checkout@v7.0.1
        with:
          repository: OpenPonk/ci-scripts
          path: ci-scripts
      - name: Load SmalltalkCI environment
        uses: hpi-swa/setup-smalltalkCI@1.6.3
        id: smalltalkci
        with:
          smalltalk-image: Pharo64-${{ env.PHARO_VERSION }}
      - name: Prepare image and test
        run: smalltalkci -s ${{ steps.smalltalkci.outputs.smalltalk-image }}
        shell: bash
        timeout-minutes: 12
      - name: Prepare zip script
        run: chmod u+x ci-scripts/.github/scripts/build-mac.sh
      - name: Create zip
        run: ci-scripts/.github/scripts/build-mac.sh
        env: 
          ACTIONS_READ_ACCESS_TOKEN: ${{ secrets.ACTIONS_READ_ACCESS_TOKEN }}
          BUILD_DATE: ${{ needs.init.outputs.build_date }}
      - name: Cache zip
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          key: ${{ github.run_id }}-${{ github.run_number }}_${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip

  build-mac-arm:
    needs: init
    runs-on: macos-latest
    env:
      PLATFORM: mac-arm
    name: 'Build Mac ARM'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Prepare scripts directory
        run: mkdir ci-scripts
      - name: Checkout scripts
        uses: actions/checkout@v7.0.1
        with:
          repository: OpenPonk/ci-scripts
          path: ci-scripts
      - name: Load SmalltalkCI environment
        uses: hpi-swa/setup-smalltalkCI@1.6.3
        id: smalltalkci
        with:
          smalltalk-image: Pharo64-${{ env.PHARO_VERSION }}
      - name: Prepare image and test
        run: smalltalkci -s ${{ steps.smalltalkci.outputs.smalltalk-image }}
        shell: bash
        timeout-minutes: 12
      - name: Prepare zip script
        run: chmod u+x ci-scripts/.github/scripts/build-mac.sh
      - name: Create zip
        run: ci-scripts/.github/scripts/build-mac.sh
        env: 
          ACTIONS_READ_ACCESS_TOKEN: ${{ secrets.ACTIONS_READ_ACCESS_TOKEN }}
          BUILD_DATE: ${{ needs.init.outputs.build_date }}
      - name: Cache zip
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          key: ${{ github.run_id }}-${{ github.run_number }}_${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip

  check-cache-linux:
    needs: build-linux
    runs-on: ubuntu-latest
    name: 'Check Linux zip is created'
    env:     
      PLATFORM: linux
    steps:
      - name: Get zip from cache
        id: get-zip
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          key: ${{ github.run_id }}-${{ github.run_number }}_${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
      - name: Fail on cache miss
        if: steps.get-zip.outputs.cache-hit != 'true'
        run: exit 1

  check-cache-mac-intel:
    needs: build-mac-intel
    runs-on: ubuntu-latest
    name: 'Check Mac Intel zip is created'
    env:     
      PLATFORM: mac-intel
    steps:
      - name: Get zip from cache
        id: get-zip
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          key: ${{ github.run_id }}-${{ github.run_number }}_${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
      - name: Fail on cache miss
        if: steps.get-zip.outputs.cache-hit != 'true'
        run: exit 1

  check-cache-mac-arm:
    needs: build-mac-arm
    runs-on: ubuntu-latest
    name: 'Check Mac ARM zip is created'
    env:     
      PLATFORM: mac-arm
    steps:
      - name: Get zip from cache
        id: get-zip
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          key: ${{ github.run_id }}-${{ github.run_number }}_${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
      - name: Fail on cache miss
        if: steps.get-zip.outputs.cache-hit != 'true'
        run: exit 1

  check-cache-win:
    needs: build-win
    runs-on: ubuntu-latest
    name: 'Check Windows zip is created'
    env:     
      PLATFORM: win
    steps:
      - name: Get zip from cache
        id: get-zip
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          key: ${{ github.run_id }}-${{ github.run_number }}_${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          enableCrossOsArchive: true
      - name: Fail on cache miss
        if: steps.get-zip.outputs.cache-hit != 'true'
        run: exit 1

  save-stats:
    needs: [check-cache-win, check-cache-linux, check-cache-mac-intel, check-cache-mac-arm]
    runs-on: ubuntu-latest
    name: 'Save dl stats of previous build'
    env:
      PLATFORM: linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Get zip from cache
        id: get-zip
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          key: ${{ github.run_id }}-${{ github.run_number }}_${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
      - name: Prepare scripts directory
        run: mkdir ci-scripts
      - name: Checkout scripts
        uses: actions/checkout@v7.0.1
        with:
          repository: OpenPonk/ci-scripts
          path: ci-scripts
      - name: Prepare save stats script
        run: chmod u+x ci-scripts/.github/scripts/save-stats.sh
      - name: Save dl stats of last nightly build
        run: ci-scripts/.github/scripts/save-stats.sh

  create-release:
    needs: [save-stats, init]
    runs-on: ubuntu-latest
    name: 'Re-create release'
    env:
      PLATFORM: linux
    steps:
      - name: Re-create release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "nightly"
          prerelease: true
          title: "nightly-${{ needs.init.outputs.build_date }}"
      - name: Verify release title
        shell: bash
        run: |
          echo "Verifying release title from GitHub API..."
          RELEASE_NAME=$(curl -s -f -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/nightly" | jq -r .name)
          echo "Release title returned by GitHub API: '$RELEASE_NAME'"
          if [[ ! "$RELEASE_NAME" =~ ^nightly-2[0-9]{3}-[0-9]{2}-[0-9]{2}T ]]; then
            echo "ERROR: Release title '$RELEASE_NAME' does not match expected pattern 'nightly-YYYY-...'!"
            exit 1
          fi
          echo "Release title verified successfully."

  upload-zip-win:
    needs: create-release
    runs-on: ubuntu-latest
    name: 'Upload Windows zip'
    env:
      PLATFORM: win
    steps:
      - name: Get zip from cache
        id: get-zip
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          key: ${{ github.run_id }}-${{ github.run_number }}_${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          enableCrossOsArchive: true
      - name: Get Release by Tag
        id: get_release_by_tag
        uses: jonfriesen/get-release-by-tag@v0.0.11
        with:
          tag_name: nightly
      - name: Upload zip
        id: upload-zip
        uses: actions/upload-release-asset@v1.0.2
        with:
          upload_url: ${{ steps.get_release_by_tag.outputs.upload_url }}
          asset_path: ./${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          asset_name: ${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          asset_content_type: application/zip

  upload-zip-linux:
    needs: create-release
    runs-on: ubuntu-latest
    name: 'Upload Linux zip'
    env:
      PLATFORM: linux
    steps:
      - name: Get zip from cache
        id: get-zip
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          key: ${{ github.run_id }}-${{ github.run_number }}_${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
      - name: Get Release by Tag
        id: get_release_by_tag
        uses: jonfriesen/get-release-by-tag@v0.0.11
        with:
          tag_name: nightly
      - name: Upload zip
        id: upload-zip
        uses: actions/upload-release-asset@v1.0.2
        with:
          upload_url: ${{ steps.get_release_by_tag.outputs.upload_url }}
          asset_path: ./${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          asset_name: ${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          asset_content_type: application/zip

  upload-zip-mac-intel:
    needs: create-release
    runs-on: ubuntu-latest
    name: 'Upload Mac Intel zip'
    env:
      PLATFORM: mac-intel
    steps:
      - name: Get zip from cache
        id: get-zip
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          key: ${{ github.run_id }}-${{ github.run_number }}_${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
      - name: Get Release by Tag
        id: get_release_by_tag
        uses: jonfriesen/get-release-by-tag@v0.0.11
        with:
          tag_name: nightly
      - name: Upload zip
        id: upload-zip
        uses: actions/upload-release-asset@v1.0.2
        with:
          upload_url: ${{ steps.get_release_by_tag.outputs.upload_url }}
          asset_path: ./${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          asset_name: ${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          asset_content_type: application/zip

  upload-zip-mac-arm:
    needs: create-release
    runs-on: ubuntu-latest
    name: 'Upload Mac ARM zip'
    env:
      PLATFORM: mac-arm
    steps:
      - name: Get zip from cache
        id: get-zip
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          key: ${{ github.run_id }}-${{ github.run_number }}_${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
      - name: Get Release by Tag
        id: get_release_by_tag
        uses: jonfriesen/get-release-by-tag@v0.0.11
        with:
          tag_name: nightly
      - name: Upload zip
        id: upload-zip
        uses: actions/upload-release-asset@v1.0.2
        with:
          upload_url: ${{ steps.get_release_by_tag.outputs.upload_url }}
          asset_path: ./${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          asset_name: ${{ env.PROJECT_NAME }}-${{ env.PLATFORM }}-${{ env.VERSION }}.zip
          asset_content_type: application/zip

  create-dependent-matrix:
    needs: [create-release]
    runs-on: ubuntu-latest
    name: 'Find dependent repositories'
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_dependents: ${{ steps.set-matrix.outputs.has_dependents }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Create dependent build matrix (or empty)
        id: set-matrix
        shell: bash
        run: |
          BUILD_DEPENDENT="${{ inputs.build-dependent || github.event.inputs.build-dependent || 'false' }}"
          EVENT="${{ github.event_name }}"

          if [[ "$EVENT" != "push" && "$EVENT" != "schedule" && "$EVENT" != "workflow_dispatch" && "$EVENT" != "workflow_call" ]]; then
            echo "Dependent builds: disabled: unsupported event=$EVENT"
            echo "has_dependents=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ( "$EVENT" == "workflow_dispatch" || "$EVENT" == "workflow_call" ) && "$BUILD_DEPENDENT" != "true" ]]; then
            echo "Dependent builds: disabled: build-dependent input is false"
            echo "has_dependents=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! -f ./.github/dependent-repositories.txt ]]; then
            echo "Dependent builds: disabled: dependent-repositories.txt not found"
            echo "has_dependents=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          count="$(jq -e '.include | if type=="array" then length else error(".include must be an array") end' ./.github/dependent-repositories.txt)"
          if [[ "$count" == "0" ]]; then
            echo "Dependent builds: disabled: dependent-repositories.txt empty"
            echo "has_dependents=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matrix="$(jq -c '.' ./.github/dependent-repositories.txt)"
          echo "Dependent builds: enabled"
          echo "has_dependents=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-dependent:
    needs: [create-dependent-matrix]
    runs-on: ubuntu-latest
    name: 'Build dependent'
    if: ${{ needs.create-dependent-matrix.outputs.has_dependents == 'true' }}
    strategy:
      matrix: ${{fromJson(needs.create-dependent-matrix.outputs.matrix)}}
    steps:
      - name: Start ${{ matrix.repository }} build
        uses: benc-uk/workflow-dispatch@v1.3.3
        with:
          workflow: Nightly
          repo: ${{ matrix.repository }}
          ref: ${{ matrix.branch || 'master' }}
          token: ${{ secrets.WORKFLOW_ACCESS_TOKEN }}
          inputs: '{ "build-dependent": "${{ matrix.build-dependent }}" }'